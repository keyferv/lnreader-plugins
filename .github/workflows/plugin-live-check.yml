name: Plugin Live Check

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      plugin_path:
        description: 'Plugin file(s) to check (space-separated relative paths)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    name: Plugin Live Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get Changed Plugin Files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            plugins/**/*.ts
          files_ignore: |
            plugins/**/*\[*\]*.ts
            plugins/multisrc/**

      - name: Determine Targets
        id: targets
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLUGIN_PATH_INPUT: ${{ inputs.plugin_path }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'files=%s\n' "$PLUGIN_PATH_INPUT" >> "$GITHUB_OUTPUT"
          else
            printf 'files=%s\n' "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.targets.outputs.files != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        if: steps.targets.outputs.files != ''
        run: npm ci

      # Multisrc-generated files (plugins/**/*[...].ts) are excluded above.
      # They're produced from plugins/multisrc/*/template.ts + sources.json,
      # not hand-authored, so testing the generator is out of scope here.
      - name: Run Live Check
        id: live-check
        if: steps.targets.outputs.files != ''
        env:
          TARGET_FILES: ${{ steps.targets.outputs.files }}
        run: |
          set -f
          set +e
          validated=()
          # TARGET_FILES is space-separated (changed-files format / manual input).
          # Allow-list each entry so only real plugin files reach node, and
          # quote every expansion — never interpolate the list into a command.
          for file in $TARGET_FILES; do
            case "$file" in
              plugins/*.ts)
                if [ -f "$file" ]; then
                  validated+=("$file")
                else
                  echo "Skipping missing file: $file"
                fi
                ;;
              *) echo "Skipping unexpected target: $file" ;;
            esac
          done
          if [ "${#validated[@]}" -eq 0 ]; then
            echo "No valid plugin targets to check."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/live-check-plugin.js "${validated[@]}" > live-check-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat live-check-output.txt
          cat live-check-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Fail On Real Errors
        if: steps.targets.outputs.files != '' && steps.live-check.outputs.exit_code != '0'
        run: |
          echo "Live check reported at least one FAIL — see the job log or workflow summary."
          exit 1
